[project]
name = "mlfeatureengineering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core Data & Performance
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",

    # ML & Feature Engineering
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",

    # Statistics & Modeling
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0"
]